<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="header">
        <h1>My Library</h1>
        <button id="add-book">Add book</button>
        <button id="remove-all">Remove all</button>
    </div>
    <div class="right-margin"></div>
    <dialog id="add-book-dialog">
        <form method="dialog">
            <div>
                <label for="book_title">Title:</label>
                <input type="text" id="book_title" placeholder="Winnie the Pooh" name="book_title">
            </div>
            <div>
                <label for="book_author">Author:</label>
                <input type="text" id="book_author" placeholder="Christopher Something" name="book_author">
            </div>
            <div>
                <input type="radio" id="sci_fi" name="book_genre" value="sci_fi">
                <label for="sci_fi">Science Fiction</label>
            </div>
            <div>
                <input type="radio" id="high_fantasy" name="book_genre" value="high_fantasy">
                <label for="high_fantasy">High Fantasy</label>
            </div>
            <div>
                <input type="radio" id="childrens_literature" name="book_genre" value="childrens_literature">
                <label for="childrens_literature">Children's Literature</label>
            </div>
            <div>
                <input type="radio" id="unclear_genre" name="book_genre" value="unclear_genre" checked>
                <label for="unclear_genre">Unclear</label>
            </div>
            <div>
                <button id="confirm-book" type="submit" value="confirm">Add book</button>
                <button id="cancel-book" type="submit" value="cancel">Cancel</button>
            </div>
        </form>
    </dialog>
    <div id="books">
    </div>
</body>
</html>
